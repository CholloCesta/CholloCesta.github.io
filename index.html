<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CholloCesta | Chollos, Ofertas y Guías de Compra</title>
    <style>
        :root { --primary: #ff9900; --dark: #333; --light: #f4f4f4; }
        body { font-family: sans-serif; line-height: 1.6; color: var(--dark); margin: 0; padding: 0; }
        header { background: #fff; padding: 2rem; text-align: center; border-bottom: 2px solid var(--primary); }
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
        .flash-card { border: 2px solid #ff0000; background: #fff0f0; }
        .cta { display: inline-block; background: var(--primary); color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-top: 10px; }
        footer { background: var(--light); padding: 20px; text-align: center; margin-top: 40px; }
    </style>
</head>
<body>
<header>
    <h1>CholloCesta</h1>
    <p>La mejor selección de ofertas, chollos y guías de compra.</p>
</header>
<div class="container">
    <section id="flash-deals">
        <h2>⚡ Chollos Flash del Día</h2>
        <div id="flash-container" class="grid">
            <!-- Cargando chollos... -->
        </div>
    </section>
    <h2>Categorías</h2>
    <div class="grid">
        <a href="perros.html" class="card"><h3>Perros</h3></a>
        <a href="gatos.html" class="card"><h3>Gatos</h3></a>
    </div>
</div>
<footer>
    <p>CholloCesta participa en Afiliados de Amazon. <a href="/privacidad">Política de Privacidad</a></p>
</footer>
<script>
async function loadFlashDeals() {
    try {
        const response = await fetch('/data/flash_deals.json');
        const data = await response.json();
        const container = document.getElementById('flash-container');
        container.innerHTML = '';
        data.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card flash-card';
            card.innerHTML = `<h3>${p.title}</h3><a href="${p.url}" class="cta" target="_blank">Ver chollo</a>`;
            container.appendChild(card);
        });
    } catch(e) { console.log("Cargando chollos..."); }
}
loadFlashDeals();
</script>
</body>
</html>
