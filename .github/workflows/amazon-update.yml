name: Actualizar Catálogo Amazon
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      CREATORS_API_CREDENTIAL_ID: ${{ secrets.CREATORS_API_CREDENTIAL_ID }}
      CREATORS_API_CREDENTIAL_SECRET: ${{ secrets.CREATORS_API_CREDENTIAL_SECRET }}
      CREATORS_API_VERSION: ${{ secrets.CREATORS_API_VERSION }}
      PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG || 'chollocesta-21' }}
      PAAPI_MARKETPLACE: ${{ vars.PAAPI_MARKETPLACE || 'www.amazon.es' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install requests
      - name: Consultar Amazon Creators API
        run: python scripts/update_catalog.py
      - name: Commit y Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/productos_perros.json data/productos_gatos.json data/flash_deals.json
          if git diff --cached --quiet; then
            echo 'No hay cambios'
          else
            git commit -m 'Actualización automática diaria del catálogo'
            git push
          fi
