name: Actualizar Catálogo Amazon
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests
      - name: Ejecutar Script
        env:
          PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
          PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
        run: python scripts/fetch_amazon_products.py
      - name: Commit y Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/productos_paapi.json
          git commit -m "Actualización automática diaria del catálogo" || echo "No hay cambios"
          git push
