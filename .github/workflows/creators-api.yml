name: Creators API - imágenes de productos para perros (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      CREATORS_API_CREDENTIAL_ID: ${{ secrets.CREATORS_API_CREDENTIAL_ID }}
      CREATORS_API_CREDENTIAL_SECRET: ${{ secrets.CREATORS_API_CREDENTIAL_SECRET }}
      CREATORS_API_VERSION: ${{ secrets.CREATORS_API_VERSION }}
      PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG || 'chollocesta-21' }}
      PAAPI_MARKETPLACE: ${{ vars.PAAPI_MARKETPLACE || 'www.amazon.es' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencia HTTP
        run: python -m pip install --disable-pip-version-check requests
      - name: Consultar Amazon Creators API y actualizar imágenes oficiales
        run: python scripts/creators_api_dogs.py
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add perros.html data/perros_creators_api.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore(perros): actualiza productos e imágenes desde Creators API"
            git push
          fi
