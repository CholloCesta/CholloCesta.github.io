name: PA-API - fotos reales de producto

on:
  workflow_dispatch:
  schedule:
    # diario a las 7:17 (hora baja de trafico de la API)
    - cron: "17 7 * * *"

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
      PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
      PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
      PAAPI_MARKETPLACE: ${{ vars.PAAPI_MARKETPLACE || 'www.amazon.es' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar firma SigV4
        run: python scripts/paapi_client.py

      - name: Consultar imagenes de producto
        run: python scripts/paapi_fetch_images.py

      - name: Aplicar fotos reales a las paginas
        run: python scripts/apply_paapi_images.py

      - name: Publicar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore(paapi): actualiza fotos de producto desde la PA-API 5.0"
            git pull --rebase --autostash || true
            git push
          fi
